name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a force-push or a second commit on a PR cancels the run it
# supersedes, so the queue never fills with stale checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "24"]
    env:
      # No network in CI: font weights come from the bundled fallbacks instead
      # of Google Fonts, so a Google outage can never turn the suite red.
      RI_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  examples:
    name: examples build
    runs-on: ubuntu-latest
    # A framework integration breaks in ways the unit suite cannot see — a
    # plugin ordering change, a scan glob that misses a framework's source
    # directory, a snapshot that does not survive a bundler's module boundary.
    # Each example is a real build of a real app.
    timeout-minutes: 20
    env:
      RI_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rainbowindex
        # Redundant on paper — the root `prepare` script already builds during
        # install — but kept because the ordering is load-bearing and easy to
        # break. pnpm links each example's `rainbowindex` bin from this
        # package's `bin` field at install time and *silently skips* the link
        # when dist/cli.mjs is not there yet; a later build never creates it,
        # so the examples' CLI steps die with `rainbowindex: not found`. Do not
        # "simplify" this by dropping `prepare` in favour of this step.
        run: pnpm build

      - name: Build every example
        run: pnpm examples:build
